name: ci

env:
  WRANGLER_SEND_METRICS: "false"

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && 'pr' || 'run' }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: dev smoke
        run: node scripts/dev-smoke.mjs 8793 /health --var CANVAS_REGION:unknown
      - run: npm run test:e2e
  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm install --no-save --package-lock=false agentic-design@0.8.0 agentic-identity@0.9.0 agentic-realtime@0.4.4
      - run: npm run build
      - run: npm run typecheck
      - run: npx vitest run --exclude src/dependency-versions.test.ts
